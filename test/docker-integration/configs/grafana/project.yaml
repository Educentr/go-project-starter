main:
  name: grafanatest
  logger: zerolog
  registry_type: github

post_generate: []

git:
  repo: git@github.com:test/grafanatest.git
  module_path: github.com/test/grafanatest

tools:
  protobuf_version: 1.7.0
  golang_version: "1.27"
  ogen_version: v1.18.0
  golangci_version: 2.1.6

grafana:
  datasources:
    # Explicit uid: this dashboard is meant for a shared Grafana where the
    # metrics datasource is provisioned centrally as "victoriametrics".
    # Loki below has no uid and keeps the generated default (ds-loki).
    - name: Prometheus
      uid: victoriametrics
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
      editable: false
    - name: Loki
      type: loki
      access: proxy
      url: http://loki:3100
      isDefault: false
      editable: false
  annotations:
    # Comma-separated tags, every optional field spelled out.
    - name: "Deploys / Restarts / Crashes"
      icon_color: yellow
      datasource: grafana
      tags: deploy, restart, crash
      match_any: true
      limit: 50
    # Tags as a YAML list, everything optional left at its default
    # (icon_color yellow, limit 100, enable true, match_any false).
    - name: Migrations
      tags:
        - migration

rest:
  - name: api
    path:
      - ./api.swagger.yml
    api_prefix: /
    version: "v1"
    port: 8080
    public_service: true
    generator_type: ogen
    generator_params:
      auth_handler: "off"
  - name: sys
    port: 8085
    version: "v1"
    generator_type: template
    generator_template: sys

applications:
  - name: api
    transport:
      - name: api
      - name: sys
    grafana:
      datasources:
        - Prometheus
        - Loki
