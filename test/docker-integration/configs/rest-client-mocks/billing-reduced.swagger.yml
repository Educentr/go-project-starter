# The contract of the billing client after an operation is dropped. The
# integration test copies this file over the spec the generator placed in
# api/rest/billing/v1/ and runs `make generate` again: the regenerated mock
# must follow the shrunken interface and keep compiling.
#
# Not referenced from project.yaml — it travels with the config dir only.
openapi: 3.0.2
servers:
  - url: http://billing.invalid/v1
    description: External billing provider
info:
  version: 1.0.0
  title: Billing Partner API
tags:
  - name: invoices
    description: Invoice endpoints
paths:
  /invoices/{id}:
    get:
      tags:
        - invoices
      summary: Get an invoice
      operationId: getInvoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDefault'
components:
  schemas:
    Invoice:
      required:
        - id
      properties:
        id:
          type: string
        amount:
          type: integer
          format: int64
      type: object
    ErrorDefault:
      required:
        - code
        - error
      properties:
        code:
          type: integer
          format: int32
        error:
          type: string
      type: object
