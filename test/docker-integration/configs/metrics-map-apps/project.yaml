main:
  name: metricsappstest
  logger: zerolog
  registry_type: github

post_generate: []

git:
  repo: git@github.com:test/metricsappstest.git
  module_path: github.com/test/metricsappstest

tools:
  protobuf_version: 1.7.0
  golang_version: "1.24"
  ogen_version: v1.18.0
  golangci_version: 2.1.6

metrics:
  path: ./metrics-map.yaml

grafana:
  datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
      editable: false

rest:
  - name: api
    path:
      - ./api.swagger.yml
    api_prefix: /
    version: "v1"
    port: 8080
    public_service: true
    generator_type: ogen
    generator_params:
      auth_handler: "off"
  - name: sys
    port: 8085
    version: "v1"
    generator_type: template
    generator_template: sys
  - name: sysadmin
    port: 8086
    version: "v1"
    generator_type: template
    generator_template: sys

# A Kafka producer attached to ONE application only: its declarations are
# constructed by the producer driver, so the other application must get neither
# its collectors nor its dashboard panels.
kafka:
  - name: events_producer
    type: producer
    driver: segmentio
    client: main_kafka
    events:
      - name: user_events

# Three applications of one service — the shape the `apps` field exists for.
applications:
  - name: api
    transport:
      - name: api
      - name: sys
    kafka:
      - events_producer
    grafana:
      datasources:
        - Prometheus

  - name: admin
    transport:
      - name: sysadmin
    grafana:
      datasources:
        - Prometheus

  # No sys transport: no /metrics endpoint, nothing to register into. It has a
  # dashboard anyway (dashboards follow the datasource, not the sys transport),
  # which is the case where a Service Metrics row could only ever read empty.
  - name: worker
    transport:
      - name: api
    grafana:
      datasources:
        - Prometheus
