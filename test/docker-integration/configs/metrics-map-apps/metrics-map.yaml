# A metrics map for a service that is several processes. `apps` says which of
# them publishes a declaration; a declaration without it is published by every
# application that exposes /metrics.
metrics:
  # Published by one application only — the shape the field exists for.
  - name: spawn_errors_total
    type: CounterVec
    labels: reason, stage
    help: Spawn attempts that failed, by reason and stage.
    apps: [api]

  # The comma-separated scalar form, and two applications at once.
  - name: queue_depth
    type: Gauge
    help: Number of tasks currently waiting in the queue.
    apps: api, admin

  - name: admin_actions_total
    type: Counter
    help: Administrative actions performed.
    apps:
      - admin

  # An application WITHOUT a /metrics endpoint. It has no endpoint to put the
  # collector on, so it takes it into a registry of its own code — the shape
  # the field exists for: a process whose instruments are deliberately
  # package-private.
  - name: worker_runs_total
    type: Counter
    help: Worker runs started.
    apps: [worker]

  # No `apps`: published by every application with a /metrics endpoint. This is
  # the pre-existing behavior, and what a single-process service writes. It
  # deliberately stops at the endpoint-less application: handing the service's
  # server-side metrics to that process's private registry would be the
  # inverse of the defect this field removes.
  - name: restarts_total
    type: Counter
    help: Process restarts since start.
