# What a component the project declares optional means for the registry of
# OnlineConf keys and for the generated startup checks: `optional: true` is per
# wiring, so one application saying it can run without a component does not
# answer for another that cannot — and the two have to read it the same way, or
# the registry publishes a key to seed that no process verifies.
main:
  name: octolerant
  logger: zerolog
  registry_type: github

post_generate: []

git:
  repo: git@github.com:test/octolerant.git
  module_path: github.com/test/octolerant

tools:
  protobuf_version: 1.7.0
  golang_version: "1.24"
  ogen_version: v1.18.0
  golangci_version: 2.1.6

rest:
  - name: api
    path:
      - ./api.swagger.yml
    api_prefix: /
    version: "v1"
    port: 8080
    public_service: true
    generator_type: ogen
    generator_params:
      auth_handler: "off"
  # Optional for the api application, mandatory for the worker one: the worker
  # process does not come up without the host, so the key has to be seeded.
  - name: billing
    path:
      - ./billing.swagger.yml
    version: "v1"
    generator_type: ogen_client
    auth_params:
      transport: header
      type: basic
  - name: sys
    port: 8085
    version: "v1"
    generator_type: template
    generator_template: sys

# Two producers, so that both answers to "does any process need the brokers" are
# in one project.
kafka:
  # Optional in the single application that wires it: nothing of this project
  # refuses to start without the brokers, so the required key of the producer is
  # checked nowhere.
  - name: events_producer
    type: producer
    driver: segmentio
    client: main_kafka
    events:
      - name: user_events
  # Optional for the api application, mandatory for the worker one. A producer
  # is never nil, so ValidateFor<App> says nothing about it: the only thing that
  # keeps the worker from starting without the brokers is the startup check of
  # the key, which is why the registry row and that check have to agree.
  - name: audit_producer
    type: producer
    driver: segmentio
    client: audit_kafka
    events:
      - name: audit_events

applications:
  - name: api
    transport:
      - name: api
      - name: billing
        config:
          optional: true
      - name: sys
    kafka:
      - name: events_producer
        optional: true
      - name: audit_producer
        optional: true

  - name: worker
    transport:
      - name: billing
      - name: sys
    kafka:
      - name: audit_producer
