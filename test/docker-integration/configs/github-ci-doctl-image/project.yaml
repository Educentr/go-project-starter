main:
  name: github-ci-doctl-image-test
  logger: zerolog
  registry_type: digitalocean

git:
  repo: git@github.com:test/github-ci-doctl-image-test.git
  module_path: github.com/test/github-ci-doctl-image-test

tools:
  golang_version: "1.24"
  ogen_version: v1.18.0
  golangci_version: 2.1.6
  goat_version: v0.5.0
  goat_services_version: v0.2.2

github_ci:
  doctl: image

  # A check that logs in to the registry: the checks job must take doctl from
  # the runner image like every other job, not install it with action-doctl.
  checks:
    - name: guards
      run: make lint-guards
      registry_login: true

rest:
  - name: api
    path:
      - ./api.swagger.yml
    api_prefix: /
    version: "v1"
    port: 8080
    public_service: true
    generator_type: ogen
    generator_params:
      auth_handler: "off"
  - name: sys
    port: 8085
    version: "v1"
    generator_type: template
    generator_template: sys

applications:
  - name: api
    goat_tests_config:
      enabled: true
      binary_path: /tmp/api
    transport:
      - name: api
      - name: sys
