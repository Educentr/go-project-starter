# A project whose ONLY REST transport is a client.
#
# The REST configuration provider is generated for any project with a REST
# transport, so this shape generates a provider that calls every REST *server*
# accessor while the project serves no REST transport at all. It is the fixture
# for TestGenerateRESTClientOnlyProject: gating the accessor set on the
# project's dimensions made this project stop compiling.
main:
  name: clientonlytest
  logger: zerolog
  registry_type: github

git:
  repo: git@github.com:test/clientonlytest.git
  module_path: github.com/test/clientonlytest

tools:
  golang_version: "1.24"
  ogen_version: v1.18.0
  golangci_version: 2.1.6

post_generate: []

rest:
  - name: billing
    path:
      - ./api.swagger.yml
    version: v1
    generator_type: ogen_client

applications:
  - name: api
    transport:
      - name: billing
