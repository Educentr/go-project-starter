main:
  name: appdockertest
  logger: zerolog
  registry_type: github

# Nothing below the generated recipes is inspected by the test, so the
# post-generate chain is not needed.
post_generate: []

git:
  repo: git@github.com:test/appdockertest.git
  module_path: github.com/test/appdockertest

tools:
  golang_version: "1.24"
  ogen_version: v1.18.0
  golangci_version: 2.1.6

rest:
  - name: api
    path:
      - ./api.swagger.yml
    api_prefix: /
    version: "v1"
    port: 8080
    public_service: true
    generator_type: ogen
    generator_params:
      auth_handler: "off"
  - name: sys
    port: 8085
    version: "v1"
    generator_type: template
    generator_template: sys

applications:
  # Runtime stage declared in full: another distribution, its runtime
  # dependencies, a working directory and an entrypoint.
  - name: api
    transport:
      - name: api
      - name: sys
    docker:
      base_image: ubuntu:24.04
      packages:
        - git
        - curl
        - ca-certificates
      workdir: /workspace
      entrypoint: ["/service", "--verbose"]
  # No docker section: the historical runtime stage.
  - name: plain
    transport:
      - name: sys
