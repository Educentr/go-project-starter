# The OnlineConf keys the generated telegram authorization reads.
#
# Both ACL subtrees are keyed by telegram user id, which is a runtime key — so
# the subtrees belong to the generated code as a whole. /<service>/bot/users is
# declared as both: it is read as the blanket ACL and as the root of the per-user
# ones.
groups:
  - scope: telegram_driver
    keys:
      - path: "{service}/bot/admins"
        dynamic: true
        description: >-
          Administrator ACLs, keyed by telegram user id
          (.../admins/<telegram id>). The value is a comma-separated list of
          `role:<name>` entries and command names; `root` grants every role.

      - path: "{service}/bot/users"
        type: string
        dynamic: true
        description: >-
          User ACL. Read as a value for the blanket ACL of every user, and below
          as .../users/<telegram id> for one user. The value is a
          comma-separated list of command names; `full` grants every command.
