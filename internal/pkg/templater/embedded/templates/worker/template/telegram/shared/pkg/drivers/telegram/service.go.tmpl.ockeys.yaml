# The OnlineConf keys the generated telegram authorization reads.
#
# Both ACL subtrees are keyed by telegram user id, which the generated code
# computes at runtime — so the subtrees belong to it as a whole.
# /<service>/bot/users is read twice: as a value, for the blanket ACL of every
# user, and below, for one user.
groups:
  - scope: telegram_driver
    keys:
      - path: "{service}/bot/admins/<tgID>"
        name: BotAdminACL
        type: string
        default: "absent — the user is not an administrator"
        description: >-
          Administrator ACL of one telegram user: a comma-separated list of
          `role:<name>` entries and command names, where `root` grants every
          role.

      - path: "{service}/bot/users"
        name: BotUsersACL
        type: string
        default: "absent — the per-user ACL decides alone"
        description: >-
          Blanket user ACL, applied to every telegram user: a comma-separated
          list of command names, where `full` grants every command.

      - path: "{service}/bot/users/<tgID>"
        name: BotUserACL
        type: string
        default: "absent — the blanket ACL decides alone"
        description: User ACL of one telegram user, in the same form as the blanket one.
