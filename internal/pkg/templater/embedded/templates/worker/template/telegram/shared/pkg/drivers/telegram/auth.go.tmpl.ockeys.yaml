# The OnlineConf keys the generated telegram driver reads for authentication.
#
# The paths sit under /<service>/security because that is the prefix the driver
# is generated with (see const.go.tmpl); the token is also subscribed to, so a
# rotation reaches a running bot without a restart.
groups:
  - scope: telegram_driver
    keys:
      - path: "{service}/security/tg_token"
        type: string
        description: >-
          Bot token the driver talks to the Telegram API with. The driver
          subscribes to it: a new value rebuilds the bot in place.
