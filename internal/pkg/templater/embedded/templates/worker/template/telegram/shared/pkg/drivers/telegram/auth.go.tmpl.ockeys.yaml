# The OnlineConf keys the generated telegram driver reads for authentication.
#
# The path sits under /<service>/security because that is the prefix the driver
# is generated with (see const.go.tmpl).
groups:
  - scope: telegram_driver
    keys:
      - path: "{service}/security/tg_token"
        name: TelegramToken
        type: string
        required: true
        description: >-
          Bot token the driver talks to the Telegram API with. Required: a bot
          without a token cannot authenticate a single call, so an application
          running a telegram worker is misconfigured without it. The driver
          subscribes to the key as well — a new value rebuilds the bot in place.
