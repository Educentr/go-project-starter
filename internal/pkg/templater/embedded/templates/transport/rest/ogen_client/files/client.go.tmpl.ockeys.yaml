# The OnlineConf keys a generated REST client reads for its connection.
groups:
  - scope: rest_client
    keys:
      - path: "{service}/transport/rest/{transport}/host"
        name: RESTClientHost
        type: string
        required_at_init: true
        description: >-
          Base URL of the upstream service. The generated client reports it
          missing at Init, with the transport named, so a project that does not
          set it crash-loops on start. Not `required`, because the startup
          check cannot tell whether this installation needs the key: a client
          declared `instantiation: dynamic` in project.yaml takes its base URL
          as an argument and never reads it, and one declared `optional: true`
          is skipped when it is unset. `required_at_init` is the answer to the
          same question asked of the project rather than of the key — the
          registry carries it only for the clients of this project that do read
          it, so the guard of whoever seeds the tree can demand it.

      - path: "{service}/transport/rest/{transport}/timeout"
        name: RESTClientTimeout
        type: duration
        default: 2s
        description: Timeout of one request of this client.
