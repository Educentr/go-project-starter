# The OnlineConf keys the generated zlog constructor reads.
#
# The log level is read under a prefix the caller hands in, and the callers are
# the generated readers that compose one: the REST middleware (per request path)
# and the workers (per job). The constructor itself sees two opaque strings, so
# it reads through ONE shared accessor — and the concrete paths that accessor
# reaches are declared below it, in the scope of whoever supplies the prefix,
# each pointing back at it with `read_via`.
#
# Known defect, tracked as TOOLS-65: the constructor prepends the service name to
# a prefix that already contains it, so the lookup currently lands one level
# deeper than declared here. These declarations describe the surface the
# generated code composes, which is what the fix will restore.
groups:
  - scope: service
    keys:
      - path: "{service}/devstand"
        name: DevStand
        type: bool
        default: "false"
        description: >-
          Whether this installation is a development stand. The logger then
          writes human-readable console output instead of JSON.

      - path: "{service}/<prefix>/<levelKey>/log_level"
        name: LogLevel
        type: string
        shared: true
        default: "absent — the level of the `default` key, then info"
        description: >-
          Log level under one of the prefixes the generated readers compose. Both
          segments come from the caller, so this accessor claims no subtree: the
          paths it reaches are the ones declared with read_via below, in the
          scope of the reader that supplies the prefix.

  - scope: rest_server
    keys:
      - path: "{service}/transport/rest/{transport}/{app}/handler/default/log_level"
        type: string
        read_via: LogLevel
        default: info
        description: >-
          Log level of requests to this application, used for every url path
          that has no level of its own.

      - path: "{service}/transport/rest/{transport}/{app}/handler/<urlPath>/log_level"
        type: string
        read_via: LogLevel
        default: "the level of handler/default/log_level"
        description: Log level of requests to one url path of this application.

      - path: "{service}/transport/rest/{transport}/{app}/mw/metrics/default/log_level"
        type: string
        read_via: LogLevel
        default: info
        description: >-
          Log level of the request middleware of this application, used for
          every url path that has no level of its own.

      - path: "{service}/transport/rest/{transport}/{app}/mw/metrics/<urlPath>/log_level"
        type: string
        read_via: LogLevel
        default: "the level of mw/metrics/default/log_level"
        description: Log level of the request middleware for one url path.

  - scope: worker_daemon
    keys:
      - path: "{service}/worker/{worker}/default/log_level"
        type: string
        read_via: LogLevel
        default: info
        description: Log level of this worker, used when job/log_level is unset.

      - path: "{service}/worker/{worker}/job/log_level"
        type: string
        read_via: LogLevel
        default: "the level of default/log_level"
        description: Log level of one job run of this worker.

  - scope: worker_telegram
    keys:
      - path: "{service}/worker/{worker}/default/log_level"
        type: string
        read_via: LogLevel
        default: info
        description: Log level of this worker, used when job/log_level is unset.

      - path: "{service}/worker/{worker}/job/log_level"
        type: string
        read_via: LogLevel
        default: "the level of default/log_level"
        description: Log level of one update being handled by this worker.
